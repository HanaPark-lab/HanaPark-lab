<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="박하나 Hana Park · Model Evaluation · Vision AI · Bio × AI" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F8F8"/>
      <stop offset="0.55" stop-color="#E2EFEE"/>
      <stop offset="1" stop-color="#D3E3EC"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FA3A8"/>
      <stop offset="1" stop-color="#1E4E63"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="28"/></clipPath>
    <clipPath id="tank"><rect x="776" y="56" width="360" height="232" rx="22"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E4E63" flood-opacity="0.18"/></filter>
    <style>
      .ko { font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
      .en { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .sway { animation: sway 4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
      .s2 { animation-delay: -1.3s; } .s3 { animation-delay: -2.6s; }
      .bubble { animation: rise 5s linear infinite; }
      .b2 { animation-delay: -1.7s; } .b3 { animation-delay: -3.4s; }
      .scan { animation: scan 3.2s ease-in-out infinite alternate; }
      @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
      @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-190px); opacity: 0; } }
      @keyframes scan { from { transform: translateY(0); } to { transform: translateY(170px); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <path d="M0 300 C 200 270 400 330 600 300 S 1000 270 1200 300 V340 H0 Z" fill="#C7DEDC" opacity="0.6"/>
    <circle cx="40" cy="-30" r="120" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <text x="76" y="92" class="en" font-size="17" font-weight="700" letter-spacing="4" fill="#2E7D7A">HELLO, I'M</text>
  <text x="74" y="156" class="ko" font-size="54" font-weight="800" fill="#16323F">박하나</text>
  <text x="250" y="156" class="en" font-size="32" font-weight="600" fill="#3B6274">Hana Park</text>

  <g class="en" font-size="15" font-weight="700">
    <rect x="76" y="182" width="170" height="34" rx="17" fill="#1E4E63"/>
    <text x="161" y="204" text-anchor="middle" fill="#FFFFFF">Model Evaluation</text>
    <rect x="256" y="182" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#7DB8B3" stroke-width="1.5"/>
    <text x="316" y="204" text-anchor="middle" fill="#2E7D7A">Vision AI</text>
    <rect x="386" y="182" width="110" height="34" rx="17" fill="#FFFFFF" stroke="#9DB6C6" stroke-width="1.5"/>
    <text x="441" y="204" text-anchor="middle" fill="#3B6274">Bio × AI</text>
    <rect x="506" y="182" width="140" height="34" rx="17" fill="#FFFFFF" stroke="#C9B48A" stroke-width="1.5"/>
    <text x="576" y="204" text-anchor="middle" fill="#8A6A2E">Seaweed Ph.D.</text>
  </g>

  <text x="76" y="262" class="ko" font-size="21" font-weight="600" fill="#16323F">점수보다 오류의 방향을 먼저 봅니다.</text>
  <text x="76" y="292" class="ko" font-size="16" fill="#526A76">해조류 박사 · 연구소장 출신, 데이터 Split부터 실패 분석까지 믿을 수 있는 Vision AI를 만듭니다</text>

  <!-- 오른쪽: 수조 + 비전 스캔 -->
  <g filter="url(#sh)"><rect x="776" y="56" width="360" height="232" rx="22" fill="url(#sea)"/></g>
  <g clip-path="url(#tank)">
    <g fill="#7FD1A6" opacity="0.95">
      <path class="sway" d="M840 290 C 830 240 860 210 845 160 C 870 200 865 245 858 290 Z"/>
      <path class="sway s2" d="M900 290 C 885 230 920 190 905 130 C 935 185 925 240 918 290 Z" fill="#4FB38A"/>
      <path class="sway s3" d="M1050 290 C 1040 245 1065 215 1052 170 C 1078 210 1072 250 1066 290 Z" fill="#3E9C7C"/>
      <path class="sway s2" d="M1095 290 C 1085 250 1105 225 1095 190 C 1118 222 1112 255 1108 290 Z"/>
    </g>
    <g fill="#FFFFFF" opacity="0.7">
      <circle class="bubble" cx="960" cy="290" r="5"/>
      <circle class="bubble b2" cx="990" cy="290" r="3.5"/>
      <circle class="bubble b3" cx="1020" cy="290" r="4.5"/>
    </g>
    <rect class="scan" x="776" y="80" width="360" height="2.5" fill="#B8F5E0" opacity="0.85"/>
  </g>
  <g stroke="#7FD1A6" stroke-width="2.5" fill="none" stroke-dasharray="6 5">
    <rect x="886" y="122" width="56" height="110" rx="6"/>
  </g>
  <rect x="886" y="102" width="122" height="22" rx="5" fill="#7FD1A6"/>
  <text x="947" y="118" text-anchor="middle" class="en" font-size="12.5" font-weight="700" fill="#16323F">nori · OK</text>
  <text x="800" y="84" class="en" font-size="13" font-weight="600" fill="#D9F2EC" letter-spacing="1">$ python evaluate.py --split val</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
