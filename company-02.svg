<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="LAB 02 실시간 수질 · 영상 대시보드: 사람이 하루 몇 번 손으로 재던 수질을 센서로 자동 기록하고, 카메라 7대 영상과 함께 한 화면에서 보는 모니터링 시스템을 만들었습니다. 10초 수질 자동 기록 간격" xmlns:c2pa="http://c2pa.org/manifest">
