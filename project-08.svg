<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="No.08 바다마중 앱 개발: [어떤 문제를 풀려고 만들었는지 한 줄] [무엇을 만들어 어떤 결과를 냈는지 한 줄] [숫자] [핵심 성과]">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D9E8ED"/></pattern>
    <linearGradient id="sp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D6457E" stop-opacity="0.12"/><stop offset="1" stop-color="#D6457E" stop-opacity="0.04"/></linearGradient>
    <clipPath id="cl"><rect x="0.5" y="0.5" width="1199" height="199" rx="8"/></clipPath>
    <style>
      .ko { font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
      .en { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','D2Coding','Consolas','Menlo',monospace; }
    </style>
  </defs>
  <g clip-path="url(#cl)">
    <rect width="1200" height="200" fill="#F4FAFB"/>
    <rect x="860" width="340" height="200" fill="#FFFFFF"/>
    <rect x="860" width="340" height="200" fill="url(#dots)"/>
    <rect x="860" width="340" height="200" fill="url(#sp)"/>
    <rect width="1200" height="4" fill="#D6457E"/>
  </g>
  <line x1="860" y1="22" x2="860" y2="178" stroke="#D6457E" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="8" fill="none" stroke="#D2E2E8"/>
  <text x="40" y="40" class="mono" font-size="13" font-weight="700" letter-spacing="1"><tspan fill="#D6457E">No.08</tspan><tspan fill="#8AA2AC">  ·  [어디서] · [개인/팀] · [기간]</tspan></text>
  <text x="40" y="80" class="ko" font-size="28" font-weight="800" fill="#10303C">바다마중 앱 개발</text>
  <text x="40" y="112" class="ko" font-size="16" fill="#4F6C78">[어떤 문제를 풀려고 만들었는지 한 줄]</text>
  <text x="40" y="135" class="ko" font-size="16" fill="#4F6C78">[무엇을 만들어 어떤 결과를 냈는지 한 줄]</text>
  <rect x="40" y="150" width="66" height="26" rx="3" fill="#FFFFFF" stroke="#D2E2E8"/><text x="73" y="168" text-anchor="middle" class="mono" font-size="13" fill="#4F6C78">[역할]</text><rect x="114" y="150" width="66" height="26" rx="3" fill="#FFFFFF" stroke="#D2E2E8"/><text x="146" y="168" text-anchor="middle" class="mono" font-size="13" fill="#4F6C78">[기술]</text><rect x="187" y="150" width="66" height="26" rx="3" fill="#FFFFFF" stroke="#D2E2E8"/><text x="220" y="168" text-anchor="middle" class="mono" font-size="13" fill="#4F6C78">[기술]</text>
  <text x="1030" y="40" text-anchor="middle" class="mono" font-size="11" font-weight="700" letter-spacing="2" fill="#8AA2AC">KEY METRIC</text>
  <text x="1030" y="112" text-anchor="middle" class="en" font-size="60" font-weight="800" fill="#D6457E">[숫자]</text>
  <text x="1030" y="145" text-anchor="middle" class="ko" font-size="16" font-weight="700" fill="#10303C">[핵심 성과]</text>
  <text x="1030" y="168" text-anchor="middle" class="ko" font-size="12.5" fill="#4F6C78">[보조 설명]</text>
