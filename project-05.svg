<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="No.05 콩잎 병해 분류 API: 병든 잎을 정상으로 보는 오류를 막으려고, 증강으로 모델을 키우고 자신 없는 판정은 보류하는 안전장치와 함께 서비스로 배포했습니다. 94.5% Test 정확도">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D9E8ED"/></pattern>
    <linearGradient id="sp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1593C0" stop-opacity="0.12"/><stop offset="1" stop-color="#1593C0" stop-opacity="0.04"/></linearGradient>
    <clipPath id="cl"><rect x="0.5" y="0.5" width="1199" height="199" rx="8"/></clipPath>
    <style>
      .ko { font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
      .en { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','D2Coding','Consolas','Menlo',monospace; }
    </style>
  </defs>
  <g clip-path="url(#cl)">
    <rect width="1200" height="200" fill="#F4FAFB"/>
    <rect x="860" width="340" height="200" fill="#FFFFFF"/>
    <rect x="860" width="340" height="200" fill="url(#dots)"/>
    <rect x="860" width="340" height="200" fill="url(#sp)"/>
    <rect width="1200" height="4" fill="#1593C0"/>
  </g>
  <line x1="860" y1="22" x2="860" y2="178" stroke="#1593C0" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="8" fill="none" stroke="#D2E2E8"/>
  <text x="40" y="40" class="mono" font-size="13" font-weight="700" letter-spacing="1"><tspan fill="#1593C0">No.05</tspan><tspan fill="#8AA2AC">  ·  KH · SOLO · 2026.11</tspan></text>
  <text x="40" y="80" class="ko" font-size="28" font-weight="800" fill="#10303C">콩잎 병해 분류 API</text>
  <text x="40" y="112" class="ko" font-size="16" fill="#4F6C78">병든 잎을 정상으로 보는 오류를 막으려고, 증강으로 모델을 키우고</text>
  <text x="40" y="135" class="ko" font-size="16" fill="#4F6C78">자신 없는 판정은 보류하는 안전장치와 함께 서비스로 배포했습니다.</text>
  <rect x="40" y="150" width="94" height="26" rx="3" fill="#FFFFFF" stroke="#D2E2E8"/><text x="87" y="168" text-anchor="middle" class="mono" font-size="13" fill="#4F6C78">ResNet-18</text><rect x="142" y="150" width="79" height="26" rx="3" fill="#FFFFFF" stroke="#D2E2E8"/><text x="182" y="168" text-anchor="middle" class="mono" font-size="13" fill="#4F6C78">FastAPI</text><rect x="229" y="150" width="71" height="26" rx="3" fill="#FFFFFF" stroke="#D2E2E8"/><text x="264" y="168" text-anchor="middle" class="mono" font-size="13" fill="#4F6C78">Celery</text>
  <text x="1030" y="40" text-anchor="middle" class="mono" font-size="11" font-weight="700" letter-spacing="2" fill="#8AA2AC">KEY METRIC</text>
  <text x="1030" y="112" text-anchor="middle" class="en" font-size="60" font-weight="800" fill="#1593C0">94.5%</text>
  <text x="1030" y="145" text-anchor="middle" class="ko" font-size="16" font-weight="700" fill="#10303C">Test 정확도</text>
  <text x="1030" y="168" text-anchor="middle" class="ko" font-size="12.5" fill="#4F6C78">병 → 정상 오류 0건</text>
</svg>