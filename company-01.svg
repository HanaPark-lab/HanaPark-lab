<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="LAB 01 수중 김 이미지 분할 · 성장 예측: 수조 사진에서 김 길이를 cm로 자동 계산해 30일 성장을 예측하는 과제를 기획하고, AI 담당자의 개발 결과를 검토하며 개선 방향을 잡았습니다. 463장 학습 이미지 확장">
  <defs>
