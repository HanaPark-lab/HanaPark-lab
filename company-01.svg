<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="CAREER 김 육상양식 연구소장: 바다 밖에서 김을 안정적으로 키우려고 배양 조건과 자체 배지를 연구하고, 김 성장률 · 색택 이미지를 머신러닝으로 분석했습니다. ×100 파일럿 규모 확대">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D9E8ED"/></pattern>
    <linearGradient id="sp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C2850C" stop-opacity="0.12"/><stop offset="1" stop-color="#C2850C" stop-opacity="0.04"/></linearGradient>
    <clipPath id="cl"><rect x="0.5" y="0.5" width="1199" height="199" rx="8"/></clipPath>
    <style>
      .ko { font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; }
      .en { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','D2Coding','Consolas','Menlo',monospace; }
    </style>
  </defs>
  <g clip-path="url(#cl)">
    <rect width="1200" height="200" fill="#F4FAFB"/>
    <rect x="860" width="340" height="200" fill="#FFFFFF"/>
    <rect x="860" width="340" height="200" fill="url(#dots)"/>
    <rect x="860" width="340" height="200" fill="url(#sp)"/>
    <rect width="1200" height="4" fill="#C2850C"/>
  </g>
  <line x1="860" y1="22" x2="860" y2="178" stroke="#C2850C" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="8" fill="none" stroke="#D2E2E8"/>
  <text x="40" y="40" class="mono" font-size="13" font-weight="700" letter-spacing="1"><tspan fill="#C2850C">CAREER</tspan><tspan fill="#8AA2AC">  ·  R&amp;D LAB · 2025.06 – 2026.06</tspan></text>
  <text x="40" y="80" class="ko" font-size="28" font-weight="800" fill="#10303C">김 육상양식 연구소장</text>
  <text x="40" y="112" class="ko" font-size="16" fill="#4F6C78">바다 밖에서 김을 안정적으로 키우려고 배양 조건과 자체 배지를 연구하고,</text>
  <text x="40" y="135" class="ko" font-size="16" fill="#4F6C78">김 성장률 · 색택 이미지를 머신러닝으로 분석했습니다.</text>
  <rect x="40" y="150" width="76" height="26" rx="3" fill="#FFFFFF" stroke="#D2E2E8"/><text x="78" y="168" text-anchor="middle" class="mono" font-size="13" fill="#4F6C78">연구소장</text><rect x="124" y="150" width="86" height="26" rx="3" fill="#FFFFFF" stroke="#D2E2E8"/><text x="167" y="168" text-anchor="middle" class="mono" font-size="13" fill="#4F6C78">1년 1개월</text><rect x="218" y="150" width="97" height="26" rx="3" fill="#FFFFFF" stroke="#D2E2E8"/><text x="267" y="168" text-anchor="middle" class="mono" font-size="13" fill="#4F6C78">사내 비공개</text>
  <text x="1030" y="40" text-anchor="middle" class="mono" font-size="11" font-weight="700" letter-spacing="2" fill="#8AA2AC">KEY METRIC</text>
  <text x="1030" y="112" text-anchor="middle" class="en" font-size="60" font-weight="800" fill="#C2850C">×100</text>
  <text x="1030" y="145" text-anchor="middle" class="ko" font-size="16" font-weight="700" fill="#10303C">파일럿 규모 확대</text>
  <text x="1030" y="168" text-anchor="middle" class="ko" font-size="12.5" fill="#4F6C78">입사 8개월 만에 · 원가 −80% 가능성</text>
</svg>