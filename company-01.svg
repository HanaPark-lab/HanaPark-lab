    <rect x="860" width="340" height="200" fill="#FFFFFF"/>
    <rect x="860" width="340" height="200" fill="url(#dots)"/>
    <rect x="860" width="340" height="200" fill="url(#sp)"/>
    <rect width="1200" height="4" fill="#2474C6"/>
  </g>
  <line x1="860" y1="22" x2="860" y2="178" stroke="#2474C6" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="8" fill="none" stroke="#D2E2E8"/>
  <text x="40" y="40" class="mono" font-size="13" font-weight="700" letter-spacing="1"><tspan fill="#2474C6">LAB 01</tspan><tspan fill="#8AA2AC">  ·  SECOND SEA R&amp;D · 2025.08 – 2025.12 · 기획 · 방향 설정</tspan></text>
  <text x="40" y="80" class="ko" font-size="28" font-weight="800" fill="#10303C">수중 김 이미지 분할 · 성장 예측</text>
  <text x="40" y="112" class="ko" font-size="16" fill="#4F6C78">수조 사진에서 김 길이를 cm로 자동 계산해 30일 성장을 예측하는 과제를</text>
